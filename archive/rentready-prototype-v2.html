<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RentReady VIC — your complete Victorian rental toolkit. Application checklist, Centrelink income test, RentAssist eligibility, and rent affordability.">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light dark">
<title>RentReady VIC — Victorian Rental Toolkit</title>
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root {
  --brand: #4f46e5;
  --brand-2: #7c3aed;
  --brand-soft: #eef2ff;
  --brand-line: #c7d2fe;

  --bg: #f1f4f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --ink: #0f172a;
  --ink-soft: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;

  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #dbeafe;
  --accent-line: #93c5fd;

  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --ok-line: #86efac;

  --warn: #d97706;
  --warn-soft: #fef3c7;
  --warn-line: #fcd34d;

  --bad: #dc2626;
  --bad-soft: #fee2e2;
  --bad-line: #fca5a5;

  --rights: #9a3412;
  --rights-soft: #ffedd5;
  --rights-line: #fdba74;

  --info: #0369a1;
  --info-soft: #e0f2fe;
  --info-line: #7dd3fc;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 20px 40px -10px rgba(15, 23, 42, 0.15);

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --brand: #818cf8;
  --brand-2: #a78bfa;
  --brand-soft: #1e1b4b;
  --brand-line: #3730a3;

  --bg: #0b1220;
  --surface: #131c31;
  --surface-2: #1a2438;
  --surface-3: #1e293b;
  --ink: #f1f5f9;
  --ink-soft: #cbd5e1;
  --muted: #94a3b8;
  --faint: #64748b;
  --line: #1e293b;
  --line-strong: #334155;

  --accent: #60a5fa;
  --accent-hover: #93c5fd;
  --accent-soft: #1e3a8a;
  --accent-line: #1d4ed8;

  --ok: #4ade80;
  --ok-soft: #14532d;
  --ok-line: #166534;

  --warn: #fbbf24;
  --warn-soft: #78350f;
  --warn-line: #92400e;

  --bad: #f87171;
  --bad-soft: #7f1d1d;
  --bad-line: #991b1b;

  --rights: #fb923c;
  --rights-soft: #7c2d12;
  --rights-line: #9a3412;

  --info: #38bdf8;
  --info-soft: #0c4a6e;
  --info-line: #075985;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  --shadow-xl: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
}

/* ============================================================
   2. RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
*::selection { background: var(--accent-soft); color: var(--accent); }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--transition), color var(--transition);
}

h1, h2, h3, h4, h5 { margin: 0; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

:root { --header-h: 60px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   3. APP SHELL
   ============================================================ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
[data-theme="light"] .app-header { background: rgba(255, 255, 255, 0.92); }
[data-theme="dark"] .app-header { background: rgba(19, 28, 49, 0.92); }

.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 1rem;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 700;
  font-size: 1.02rem;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-decoration: none;
}
.brand:hover { text-decoration: none; }

.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
}

.brand-name { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name small {
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 0.4rem;
  align-items: center;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.icon-btn svg { width: 18px; height: 18px; }

/* ============================================================
   4. LAYOUT
   ============================================================ */
.app-main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 1.25rem 1rem 4rem;
}

/* ============================================================
   5. TABS
   ============================================================ */
.tabs-nav {
  display: flex;
  gap: 0.25rem;
  overflow-x: auto;
  padding-bottom: 0.2rem;
  margin-bottom: 1.25rem;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.tabs-nav::-webkit-scrollbar { height: 4px; }
.tabs-nav::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }

.tab-btn {
  flex-shrink: 0;
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.55rem 0.9rem;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { background: var(--surface); color: var(--ink); }
.tab-btn.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.tab-btn svg { width: 16px; height: 16px; }
.tab-btn .tab-count {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.05rem 0.4rem;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tab-btn.active .tab-count { background: rgba(255,255,255,0.18); color: var(--surface); }

/* ============================================================
   6. PANELS
   ============================================================ */
.panel { display: none; animation: panelFade var(--transition); }
.panel.active { display: block; }
@keyframes panelFade {
  from { opacity: 0; transform: translateY(2px); }
  to { opacity: 1; transform: none; }
}

/* ============================================================
   7. CARDS
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 0.85rem;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-head {
  padding: 0.9rem 1.15rem;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 0.65rem;
  font-weight: 600;
  font-size: 0.95rem;
  background: var(--surface);
}
.card-head .num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 700;
  flex-shrink: 0;
}
.card-head .head-actions { margin-left: auto; display: flex; gap: 0.35rem; }
.card-body { padding: 1rem 1.15rem 1.15rem; }

/* ============================================================
   8. HOME DASHBOARD
   ============================================================ */
.hero {
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
  border-radius: var(--radius-xl);
  padding: 1.75rem 1.5rem;
  color: #fff;
  margin-bottom: 1rem;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.hero::before {
  content: '';
  position: absolute;
  top: -40%;
  right: -10%;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
  border-radius: 50%;
}
.hero-content { position: relative; max-width: 640px; }
.hero h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
.hero p { font-size: 0.95rem; opacity: 0.92; line-height: 1.5; }
.hero-actions { margin-top: 1.1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.hero-btn {
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0.55rem 1rem;
  border-radius: 999px;
  border: 1px solid transparent;
  background: #fff;
  color: var(--brand);
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.hero-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.hero-btn.ghost {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border-color: rgba(255,255,255,0.25);
}
.hero-btn.ghost:hover { background: rgba(255,255,255,0.2); }
.hero-btn svg { width: 15px; height: 15px; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1rem 1.1rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  transition: all var(--transition);
}
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--accent-line);
}
.stat-card .stat-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.stat-card .stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.stat-card .stat-sub {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.4;
}
.stat-card .stat-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.2rem;
}
.stat-card .stat-icon svg { width: 17px; height: 17px; }
.stat-card.accent .stat-icon { background: var(--accent-soft); color: var(--accent); }
.stat-card.ok .stat-icon { background: var(--ok-soft); color: var(--ok); }
.stat-card.warn .stat-icon { background: var(--warn-soft); color: var(--warn); }
.stat-card.bad .stat-icon { background: var(--bad-soft); color: var(--bad); }
.stat-card.brand .stat-icon { background: var(--brand-soft); color: var(--brand); }

.quick-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 0.75rem;
}
.quick-link {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  font: inherit;
  color: var(--ink);
}
.quick-link:hover {
  border-color: var(--accent-line);
  transform: translateX(2px);
  box-shadow: var(--shadow-sm);
}
.quick-link .ql-icon {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quick-link .ql-icon svg { width: 20px; height: 20px; }
.quick-link .ql-text { flex: 1; min-width: 0; }
.quick-link .ql-title { font-weight: 600; font-size: 0.92rem; }
.quick-link .ql-desc { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
.quick-link .ql-arrow { color: var(--faint); flex-shrink: 0; }

/* ============================================================
   9. FORM FIELDS
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1rem 1.25rem;
}
.field { display: flex; flex-direction: column; min-width: 0; }
.field.full { grid-column: 1 / -1; }

.field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
  min-width: 0;
}
.field-head label {
  font-size: 0.82rem;
  color: var(--ink-soft);
  font-weight: 500;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

input[type="text"],
input[type="number"],
input[type="date"],
input[type="tel"],
input[type="email"],
select,
textarea {
  font: inherit;
  font-size: 0.9rem;
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}
input[type="number"] { font-variant-numeric: tabular-nums; }
textarea { resize: vertical; min-height: 62px; font-family: inherit; }

.input-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  min-width: 0;
}
.input-row input[type="number"] { width: 104px; flex-shrink: 0; }
.slider-wrap { flex: 1; min-width: 80px; display: flex; align-items: center; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 5px;
  background: var(--line);
  border-radius: 999px;
}
input[type="range"]::-moz-range-track {
  height: 5px;
  background: var(--line);
  border-radius: 999px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
  margin-top: -6px;
  transition: transform var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
}
input[type="range"].ok::-webkit-slider-thumb { background: var(--ok); }
input[type="range"].ok::-moz-range-thumb { background: var(--ok); }
input[type="range"].warn::-webkit-slider-thumb { background: var(--warn); }
input[type="range"].warn::-moz-range-thumb { background: var(--warn); }
input[type="range"].bad::-webkit-slider-thumb { background: var(--bad); }
input[type="range"].bad::-moz-range-thumb { background: var(--bad); }

.pct-badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all var(--transition);
}
.pct-badge.ok { background: var(--ok-soft); color: var(--ok); }
.pct-badge.warn { background: var(--warn-soft); color: var(--warn); }
.pct-badge.bad { background: var(--bad-soft); color: var(--bad); }
.pct-badge.info { background: var(--info-soft); color: var(--info); }

.nudge-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem; }
.nudge-row button {
  font-size: 0.72rem;
  font-weight: 500;
  padding: 0.22rem 0.55rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  transition: all var(--transition);
  font-variant-numeric: tabular-nums;
}
.nudge-row button:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.nudge-row button.primary-nudge {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
}
.nudge-row button.primary-nudge:hover { background: var(--accent); color: #fff; }

.field .suffix { font-size: 0.72rem; color: var(--faint); margin-top: 0.3rem; }
.field .suffix.mono { font-variant-numeric: tabular-nums; }

/* ============================================================
   10. BUTTONS
   ============================================================ */
button.action {
  font: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  padding: 0.45rem 0.85rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
button.action:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
button.action.primary {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
button.action.primary:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
button.action.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.action.ghost:hover { background: var(--surface-2); color: var(--accent); }
button.action.danger:hover { border-color: var(--bad); color: var(--bad); }
button.action.small { padding: 0.25rem 0.55rem; font-size: 0.75rem; }
button.action svg { width: 14px; height: 14px; }

/* ============================================================
   11. RESULTS / STATS
   ============================================================ */
.results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.65rem;
  margin-top: 1rem;
}
.stat {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.7rem 0.85rem;
  transition: all var(--transition);
}
.stat .lbl {
  font-size: 0.68rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.stat .val {
  font-size: 1.15rem;
  font-weight: 700;
  margin-top: 0.2rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.stat .sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
.stat.highlight { background: var(--accent-soft); border-color: var(--accent-line); }
.stat.highlight .val { color: var(--accent); }
.stat.peak { background: var(--ok-soft); border-color: var(--ok-line); }
.stat.peak .val { color: var(--ok); }
.stat.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.stat.warn .val { color: var(--warn); }
.stat.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.stat.bad .val { color: var(--bad); }

.verdict {
  margin-top: 0.9rem;
  padding: 0.75rem 0.9rem;
  border-radius: var(--radius);
  font-size: 0.86rem;
  border-left: 4px solid;
  line-height: 1.55;
  transition: all var(--transition);
}
.verdict.pass { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.verdict.fail { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.verdict.info { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.verdict.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.verdict strong { display: block; margin-bottom: 0.2rem; font-weight: 700; color: inherit; }

.checks { display: grid; gap: 0.45rem; margin-top: 0.9rem; }
.check {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  font-size: 0.85rem;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.check .icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  margin-top: 1px;
}
.check.pass .icon { background: var(--ok); color: #fff; }
.check.fail .icon { background: var(--bad); color: #fff; }
.check .txt { flex: 1; min-width: 0; }
.check .txt strong { display: block; font-weight: 600; }
.check .txt .detail { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }

/* ============================================================
   12. CALLOUTS
   ============================================================ */
.callout {
  border-radius: var(--radius);
  padding: 0.75rem 0.95rem;
  font-size: 0.83rem;
  line-height: 1.55;
  margin-bottom: 0.9rem;
  border-left: 4px solid;
}
.callout strong { display: block; margin-bottom: 0.25rem; font-weight: 700; }
.callout ul { margin: 0.35rem 0 0; padding-left: 1.15rem; }
.callout li { margin-bottom: 0.2rem; }
.callout.info { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.callout.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.callout.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.callout.rights { background: var(--rights-soft); border-color: var(--rights); color: var(--rights); }

/* ============================================================
   13. INFO PANELS / ATTRIBUTES / DISCRIMINATION
   ============================================================ */
.info-panel {
  margin-top: 0.55rem;
  background: var(--info-soft);
  border: 1px solid var(--info-line);
  border-left: 4px solid var(--info);
  border-radius: var(--radius-sm);
  padding: 0.7rem 0.85rem;
  font-size: 0.83rem;
  color: var(--info);
  line-height: 1.55;
}
.info-panel strong { display: block; margin-bottom: 0.25rem; font-weight: 700; }
.info-panel ul { margin: 0.35rem 0 0; padding-left: 1.15rem; }
.info-panel li { margin-bottom: 0.2rem; }

.attr-explain {
  grid-column: 1 / -1;
  background: var(--surface);
  border: 1px solid var(--rights-line);
  border-left: 4px solid var(--rights);
  border-radius: var(--radius-sm);
  padding: 0.7rem 0.85rem;
  font-size: 0.83rem;
  color: var(--ink);
  line-height: 1.55;
  margin-top: 0.5rem;
}
.attr-explain strong { color: var(--rights); display: block; margin-bottom: 0.25rem; font-weight: 700; }
.attr-explain ul { margin: 0.35rem 0 0; padding-left: 1.15rem; }
.attr-explain li { margin-bottom: 0.18rem; }

.attributes { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
.attr {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--rights-soft);
  color: var(--rights);
  border: 1px solid var(--rights-line);
  padding: 0.25rem 0.55rem 0.25rem 0.7rem;
  border-radius: 999px;
  font-size: 0.79rem;
  font-weight: 500;
}
.attr .info-btn {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  background: var(--surface);
  color: inherit;
  font-size: 0.66rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
  transition: all var(--transition);
}
.attr .info-btn:hover { background: var(--rights); color: #fff; transform: scale(1.1); }
.attr.open .info-btn { background: var(--rights); color: #fff; }

.info-inline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 1.5px solid var(--info);
  background: var(--surface);
  color: var(--info);
  font-size: 0.66rem;
  font-weight: 800;
  padding: 0;
  margin-left: 0.4rem;
  vertical-align: middle;
  line-height: 1;
  transition: all var(--transition);
  flex-shrink: 0;
}
.info-inline:hover { background: var(--info); color: #fff; transform: scale(1.1); }
.info-inline.open { background: var(--info); color: #fff; }

.discrim-badge {
  display: inline-flex;
  align-items: center;
  font-size: 0.66rem;
  font-weight: 700;
  padding: 0.12rem 0.45rem;
  border-radius: 999px;
  margin-left: 0.4rem;
  vertical-align: middle;
  white-space: nowrap;
}
.discrim-badge.no {
  background: var(--ok-soft);
  color: var(--ok);
  border: 1px solid var(--ok-line);
}
.discrim-badge.yes {
  background: var(--bad-soft);
  color: var(--bad);
  border: 1px solid var(--bad-line);
}
.discrim-note {
  margin-top: 0.5rem;
  font-size: 0.79rem;
  padding: 0.5rem 0.7rem;
  border-radius: var(--radius-sm);
  line-height: 1.5;
}
.discrim-note.no { background: var(--ok-soft); border-left: 3px solid var(--ok); color: var(--ok); }
.discrim-note.yes { background: var(--bad-soft); border-left: 3px solid var(--bad); color: var(--bad); }
.discrim-note strong { display: block; font-weight: 700; margin-bottom: 0.1rem; }

/* ============================================================
   14. CHECKLIST ITEMS
   ============================================================ */
.items { padding: 0.25rem 0; }
.item { padding: 0.8rem 1.15rem; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item-head { display: flex; gap: 0.7rem; align-items: flex-start; }
.item-head input[type="checkbox"] {

  height: 18px;
  margin-top: 2px;
  accent-color: var(--accent);
  flex-shrink: 0;
  cursor: pointer;
}
.item .body { flex: 1; min-width: 0; }
.item .title { font-weight: 500; font-size: 0.92rem; cursor: pointer; display: inline; }
.item.cant-mark .title { text-decoration: line-through; color: var(--muted); }
.item .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; line-height: 1.5; }
.item-tools { margin-top: 0.55rem; display: flex; gap: 0.4rem; flex-wrap: wrap; }
.item .cant {
  margin-top: 0.5rem;
  font-size: 0.78rem;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  user-select: none;
}
.item .cant input { width: 14px; height: 14px; accent-color: var(--warn); }

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 0.65rem 1rem;
  margin-top: 0.7rem;
  padding-top: 0.7rem;
  border-top: 1px dashed var(--line);
}
.fields .field { gap: 0.2rem; }
.fields label {
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.fields .field.full { grid-column: 1 / -1; }

.details-block {
  margin-top: 0.6rem;
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 0.65rem 0.8rem;
}
.details-block label {
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  display: block;
  margin-bottom: 0.3rem;
}
.details-block textarea { font-size: 0.85rem; min-height: 55px; background: var(--surface); }

.hidden { display: none !important; }

/* ============================================================
   15. HELP GRID
   ============================================================ */
.help-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.65rem;
  margin-top: 0.7rem;
}
.help-card {
  border: 1px solid var(--rights-line);
  background: var(--rights-soft);
  border-radius: var(--radius-sm);
  padding: 0.7rem 0.85rem;
  font-size: 0.82rem;
  color: var(--rights);
  line-height: 1.5;
}
.help-card strong { display: block; margin-bottom: 0.2rem; font-weight: 700; color: var(--rights); }
.help-card a { color: var(--rights); font-weight: 500; }

/* ============================================================
   16. PROGRESS
   ============================================================ */

  top: calc(var(--header-h) + 0.5rem);
  z-index: 20;
